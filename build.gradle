import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'
    id 'org.beryx.runtime' version '1.13.1'
}

def versionStr = project.findProperty("appVersion") ?: "1.0.0"

group = 'com.cpr3663'
version = versionStr

repositories {
    mavenCentral()
    maven { url = uri('https://frcmaven.wpi.edu/artifactory/release/') }
    maven { url = uri('https://jitpack.io') }
}

def junitVersion = '5.12.1'
def wpilibVersion = '2026.2.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainClass.set('com.cpr3663.autocreation.Launcher')
}

javafx {
    version = '21.0.6'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.swing']
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"

    implementation "edu.wpi.first.apriltag:apriltag-java:${wpilibVersion}"
    implementation "edu.wpi.first.wpimath:wpimath-java:${wpilibVersion}"
    implementation "edu.wpi.first.wpiutil:wpiutil-java:${wpilibVersion}"
    implementation "edu.wpi.first.wpiunits:wpiunits-java:${wpilibVersion}"
    implementation 'us.hebi.quickbuf:quickbuf-runtime:1.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.4'
    implementation 'com.github.Dansoftowner:jSystemThemeDetector:3.8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def packageManagerType = providers.exec {
    commandLine 'sh', '-c', 'if command -v dpkg >/dev/null; then echo deb; elif command -v rpm >/dev/null; then echo rpm; else echo unknown; fi'
}.standardOutput.asText.map { it.trim() }

runtime {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    jpackage {
        imageName = 'auto-creation'
        appVersion = versionStr
        if (Os.isFamily(Os.FAMILY_WINDOWS)) {
            installerType = 'msi'
            installerOptions = [
                    '--win-dir-chooser',
                    '--win-shortcut',
                    '--win-menu',
                    '--win-upgrade-uuid', 'ae1bf218-9767-491e-acb6-3aa92756a5ed',
            ]
            imageOptions.addAll(['--icon', 'app-icon.ico'])
        } else if (Os.isFamily(Os.FAMILY_UNIX) && !Os.isFamily(Os.FAMILY_MAC)) {
            def type = packageManagerType.get()
            if (type == 'unknown') {
                throw new GradleException('Unknown package manager type')
            } else {
                installerType = type
                installerOptions = [
                        '--linux-package-name', imageName,
                        '--linux-shortcut',
                        '--linux-menu-group', 'Utility',
                        '--linux-deb-maintainer', 'stammler.adriel@gmail.com',
                        '--linux-app-category', 'utils',
                        '--linux-package-deps',
                ]
                imageOptions.addAll(['--icon', 'app-icon.png'])
            }
        } else if (Os.isFamily(Os.FAMILY_MAC)) {
            throw new GradleException('Mac is not supported')
        } else {
            throw new GradleException('Unsupported OS: ' + System.getProperty('os.name'))
        }
    }
}

tasks.register('generateVersionProps', WriteProperties) {
    description = 'Creates a file storing the app version making it accessing by the java code'
    destinationFile = layout.buildDirectory.file('resources/main/version.properties')
    property('version', versionStr)
}

tasks.named('processResources') {
    dependsOn(tasks.named('generateVersionProps'))
}