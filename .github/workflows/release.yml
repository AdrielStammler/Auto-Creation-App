name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  JAVA_VERSION: "17"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - name: Extract version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: ./gradlew clean jpackage "-PappVersion=${{ env.VERSION }}"
      - uses: actions/upload-artifact@v5
        with:
          name: msi
          path: build/jpackage/*.msi

  build-ubuntu-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Install packaging deps
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils
      - run: chmod +x ./gradlew && ./gradlew clean jpackage "-PappVersion=${{ env.VERSION }}"
      - name: List jpackage output (debug)
        run: find build/jpackage -maxdepth 1 -type f
      - name: Create tar.gz of the app image
        run: |
          cd build/jpackage
          tar -czf auto-creation.tar.gz auto-creation
      - uses: actions/upload-artifact@v5
        with:
          name: deb-and-tar
          path: |
            build/jpackage/*.deb
            build/jpackage/auto-creation.tar.gz

  build-fedora-rpm:
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Install deps
        run: dnf install -y java-17-openjdk-devel java-17-openjdk-jmods rpm-build git which fontconfig
      - uses: actions/checkout@v5
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: chmod +x ./gradlew && ./gradlew clean jpackage "-PappVersion=${{ env.VERSION }}"
      - uses: actions/upload-artifact@v5
        with:
          name: rpm
          path: build/jpackage/*.rpm

  release:
    needs: [build-windows, build-ubuntu-deb, build-fedora-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: dist

      - name: List downloaded artifacts (debug)
        run: find dist -type f

      - name: Rename and zip
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd dist

          mv auto-creation*.msi          auto-creation-${VERSION}-windows-x64.msi
          mv auto-creation*.rpm          auto-creation-${VERSION}-linux-x64.rpm
          mv auto-creation*.deb          auto-creation-${VERSION}-linux-x64.deb
          mv auto-creation.tar.gz        auto-creation-${VERSION}-linux-x64.tar.gz

          zip auto-creation-${VERSION}-windows-x64.msi.zip auto-creation-${VERSION}-windows-x64.msi
          zip auto-creation-${VERSION}-linux-x64.rpm.zip   auto-creation-${VERSION}-linux-x64.rpm
          zip auto-creation-${VERSION}-linux-x64.deb.zip   auto-creation-${VERSION}-linux-x64.deb

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: dist/*
